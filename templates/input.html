<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Drillability Prediction | Input</title>

  <!-- ✅ Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- ✅ Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- ✅ Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #f0f4f9;
      margin: 0;
      padding-top: 80px; /* Space for navbar */
    }

    /* 🔹 Navbar */
    .navbar {
      background: linear-gradient(90deg, #007bff, #6610f2);
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      transition: all 0.4s ease-in-out;
    }

    .navbar:hover {
      background: linear-gradient(90deg, #6610f2, #007bff);
    }

    .navbar-brand {
      font-weight: 700;
      color: #fff !important;
      letter-spacing: 0.5px;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      color: #fff !important;
      font-weight: 500;
      margin-left: 20px;
      transition: all 0.3s ease-in-out;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link i {
      font-size: 1.1rem;
    }

    /* 🔹 Form Container */
    .form-container {
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      padding: 40px 60px;
      width: 50%;
      margin: 80px auto;
      text-align: center;
    }

    h2 {
      color: #0078d7;
      margin-bottom: 10px;
    }

    p {
      color: #444;
      font-size: 16px;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      color: #333;
      display: block;
      margin-top: 15px;
      text-align: left;
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: 0.2s;
    }

    input[type="number"]:focus, select:focus {
      border-color: #0078d7;
      box-shadow: 0 0 6px rgba(0,120,215,0.3);
    }

    button {
      background: linear-gradient(45deg, #0078d7, #005fa3);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-top: 25px;
    }

    button:hover {
      background: linear-gradient(45deg, #005fa3, #004b84);
      transform: translateY(-2px);
    }

    @media screen and (max-width: 768px) {
      .form-container {
        width: 85%;
        padding: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- 🔹 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">Rock Drillability</a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'user_dashboard' %}">
              <i class="bi bi-arrow-left-circle"></i> Back to Dashboard
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 🔹 Form Section -->
  <div class="form-container">
    <h2>🪨 Rock Drillability Index</h2>
    <p>Welcome, {{ username }} 👋. Please enter the required input values and select an algorithm to predict the rock’s drillability.</p>

    <form method="POST">
      {% csrf_token %}

      <label for="depth">Depth:</label>
      <input type="number" step="any" name="depth" id="depth" required>

      <label for="porosity">Porosity:</label>
      <input type="number" step="any" name="porosity" id="porosity" required>

      <label for="density">Density:</label>
      <input type="number" step="any" name="density" id="density" required>

      <label for="gamma">Gamma Ray:</label>
      <input type="number" step="any" name="gamma" id="gamma" required>

      <label for="sonic">Sonic Transit Time:</label>
      <input type="number" step="any" name="sonic" id="sonic" required>

      <label for="resistivity">Resistivity:</label>
      <input type="number" step="any" name="resistivity" id="resistivity" required>

      <label for="pressure">Pressure:</label>
      <input type="number" step="any" name="pressure" id="pressure" required>

      <!-- Algorithm Dropdown -->
      <label for="algorithm">Select Algorithm:</label>
      <select name="algorithm" id="algorithm" required>
        <option value="">-- Choose Algorithm --</option>
        {% for algo in algorithms %}
          <option value="{{ algo }}">{{ algo }}</option>
        {% endfor %}
      </select>

      <button type="submit">🔍 Drillability</button>
    </form>
  </div>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
