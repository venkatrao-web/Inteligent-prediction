<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Rock Drillability Prediction</title>

  <!-- ✅ Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ✅ Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- ✅ Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #dfe9f3 0%, #ffffff 100%);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 🔹 Navbar */
    .navbar {
      background: linear-gradient(90deg, #007bff, #6610f2);
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      transition: all 0.4s ease-in-out;
    }

    .navbar:hover {
      background: linear-gradient(90deg, #6610f2, #007bff);
    }

    .navbar-brand {
      font-weight: 700;
      color: #fff !important;
      letter-spacing: 0.5px;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      color: #fff !important;
      font-weight: 500;
      margin-left: 20px;
      transition: all 0.3s ease-in-out;
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link i {
      font-size: 1.1rem;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 2px;
      background: #fff;
      left: 0;
      bottom: 0;
      transition: width 0.3s ease-in-out;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    /* 🔹 Admin Login Box */
    .admin-box {
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      padding: 50px 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      margin: 100px auto;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .admin-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    h2 {
      font-weight: 700;
      color: #212529;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 25px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #6610f2;
      box-shadow: 0 0 6px rgba(102, 16, 242, 0.3);
      outline: none;
    }

    button {
      background: linear-gradient(90deg, #6610f2, #007bff);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.3px;
      margin-top: 15px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left 0.3s ease;
    }

    button:hover::before {
      left: 0;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    a {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      color: #007bff;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #0056b3;
      text-decoration: underline;
    }

    .messages p {
      font-weight: 600;
      font-size: 14px;
      margin-top: 15px;
    }

    .messages p.success {
      color: #198754;
    }

    .messages p.error {
      color: #dc3545;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #6c757d;
      font-size: 14px;
      background: #f8f9fa;
      border-top: 1px solid #dee2e6;
    }
  </style>
</head>

<body>
  <!-- 🔹 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home_page' %}">Rock Drillability</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
           <li class="nav-item">
            <a class="nav-link active" href="{% url 'home_page' %}">
              <i class="bi bi-house-door"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'register_page' %}">
              <i class="bi bi-person-plus"></i> Register
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login_page' %}">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </a>
          </li>
           <li class="nav-item">
            <a class="nav-link" href="{% url 'admin_login' %}">
              <i class="bi bi-person-gear"></i> Admin
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 🔹 Admin Login Form -->
  <div class="admin-box">
    <h2>🧑‍💼 Admin Login</h2>
    <p>Enter admin credentials to access the dashboard.</p>

    <form method="POST">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Admin Username" required>
      <input type="password" name="password" placeholder="Admin Password" required>
      <button type="submit"><i class="bi bi-shield-lock"></i> Login</button>
    </form>

    <a href="{% url 'home_page' %}">🏠 Back to Home</a>

    <div class="messages">
      {% for message in messages %}
        {% if message.tags == 'success' %}
          <p class="success">{{ message }}</p>
        {% else %}
          <p class="error">{{ message }}</p>
        {% endif %}
      {% endfor %}
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
